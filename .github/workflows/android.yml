name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Lint, test and build
        run: bash ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease

      - name: Check 16 KiB native alignment
        run: |
          bash scripts/check-native-alignment.sh \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/bundle/release/app-release.aab

      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm

      - name: Test app launch on an Android emulator
        run: bash scripts/run-android-emulator-tests.sh "$RUNNER_TEMP/scancode-emulator.log"

      - name: Keep Android instrumented test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scancode-instrumented-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/debug/
            app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/
            app/build/reports/androidTests/connected/debug/
            ${{ runner.temp }}/scancode-emulator.log
          retention-days: 7

      - name: Keep build artifacts
        if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scancode-android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Keep test and lint reports
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scancode-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  show-review-evidence:
    name: Show screenshot in the pull request
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: android-review-evidence
      queue: max
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Publish the screenshot and update the evidence comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          repo_api="repos/$GITHUB_REPOSITORY"
          current_head=$(gh api "$repo_api/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ "$current_head" != "$PR_HEAD" ]]; then
            echo "The pull request has a newer commit."
            exit 0
          fi

          evidence_dir="$RUNNER_TEMP/review-evidence"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name scancode-instrumented-test-reports --dir "$evidence_dir"
          screenshot=$(find "$evidence_dir" -type f -name home-screen.png -print -quit)
          test -n "$screenshot"
          test "$(file --brief --mime-type "$screenshot")" = image/png

          # Keep review images out of the application's Git history.
          branch=ci-evidence
          image_path="pr-$PR_NUMBER/home-screen.png"
          message="Android home screen for PR #$PR_NUMBER"
          encoded="$evidence_dir/image.b64"
          base64 -w0 "$screenshot" > "$encoded"
          if gh api "$repo_api/git/ref/heads/$branch" --silent 2>/dev/null; then
            image_api="$repo_api/contents/$image_path"
            previous=$(gh api "$image_api?ref=$branch" --jq .sha 2>/dev/null || true)
            update=()
            if [[ -n "$previous" ]]; then
              update=(-f "sha=$previous")
            fi
            image_commit=$(gh api --method PUT "$image_api" -f branch="$branch" -f message="$message" \
              -F "content=@$encoded" "${update[@]}" --jq .commit.sha)
          else
            blob=$(gh api "$repo_api/git/blobs" -f encoding=base64 -F "content=@$encoded" --jq .sha)
            tree=$(jq -n --arg path "$image_path" --arg sha "$blob" \
              '{tree:[{path:$path, mode:"100644", type:"blob", sha:$sha}]}' |
              gh api --method POST "$repo_api/git/trees" --input - --jq .sha)
            image_commit=$(gh api "$repo_api/git/commits" -f message="$message" -f tree="$tree" --jq .sha)
            gh api "$repo_api/git/refs" -f ref="refs/heads/$branch" -f sha="$image_commit" --silent
          fi

          marker='<!-- scancode-android-review-evidence -->'
          body="$evidence_dir/comment.md"
          cat > "$body" <<EOF
          $marker
          ### Android smoke test passed

          ScanCode opened on Android 16 and displayed the scanner title and **History** button.

          [Tested PR commit ${PR_HEAD:0:7}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$PR_HEAD) · [Workflow run and test reports]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          ![ScanCode home screen on Android 16](https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$image_commit/$image_path)
          EOF
          comments_api="$repo_api/issues/$PR_NUMBER/comments"
          comment=$(gh api "$comments_api" --paginate --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- scancode-android-review-evidence -->"))) | .id' | tail -n 1)
          if [[ -n "$comment" ]]; then
            gh api --method PATCH "$repo_api/issues/comments/$comment" -F "body=@$body" --jq .html_url
          else
            gh api --method POST "$comments_api" -F "body=@$body" --jq .html_url
          fi
